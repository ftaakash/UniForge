# Continuous integration (spec §10). Phase 1: Windows build, tests and package.
# The Linux sanitizer jobs (ASan/UBSan, TSan) and the lint job are added in Phase 5.
name: CI

on:
  push:
    branches: [main]
    tags: ['phase-*', 'v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: Windows / MSVC Release (/W4 /WX)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Configure (preset windows-msvc)
        run: cmake --preset windows-msvc

      - name: Build Release
        run: cmake --build --preset windows-release --parallel

      - name: Test
        run: ctest --preset windows-release --output-junit "${{ github.workspace }}/build/ctest-junit.xml"

      - name: Package (dependency check, hygiene scan, zip)
        # Windows PowerShell 5.1: the same shell the script is tested with locally.
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/package.ps1 -SkipBuild

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: CandidateID_Workbench
          path: dist/CandidateID_Workbench.zip
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-junit
          path: build/ctest-junit.xml
          if-no-files-found: ignore
