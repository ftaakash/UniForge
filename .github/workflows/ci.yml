# Continuous integration (spec §10). Phase 1: Windows build, tests and package.
# Phase 5: Linux core + tests under ASan/UBSan and TSan (GCC 13). The lint job comes later.
name: CI

on:
  push:
    branches: [main]
    tags: ['phase-*', 'v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: Windows / MSVC Release (/W4 /WX)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Configure (preset windows-msvc)
        run: cmake --preset windows-msvc

      - name: Build Release
        run: cmake --build --preset windows-release --parallel

      - name: Test
        run: ctest --preset windows-release --output-junit "${{ github.workspace }}/build/ctest-junit.xml"

      - name: Package (dependency check, hygiene scan, zip)
        # Windows PowerShell 5.1: the same shell the script is tested with locally.
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/package.ps1 -SkipBuild

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: RA2311042010060_Workbench
          path: dist/RA2311042010060_Workbench.zip
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-junit
          path: build/ctest-junit.xml
          if-no-files-found: ignore

  # Core + CLI + tests on Linux (no GUI): checks GCC portability with -Werror and runs the suite
  # under AddressSanitizer + UndefinedBehaviorSanitizer.
  linux-asan:
    name: Linux / GCC 13 ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc-13
      CXX: g++-13
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Lower ASLR entropy (sanitizer runtimes fail with the 24.04 default)
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure (preset linux-asan)
        run: cmake --preset linux-asan

      - name: Build
        run: cmake --build --preset linux-asan --parallel

      - name: Test
        run: ctest --preset linux-asan --parallel 4

  # The multicore code (WorkerPool, runners, benchmark) and JobRunner under ThreadSanitizer.
  linux-tsan:
    name: Linux / GCC 13 TSan (perf + services)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc-13
      CXX: g++-13
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Lower ASLR entropy (sanitizer runtimes fail with the 24.04 default)
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure (preset linux-tsan)
        run: cmake --preset linux-tsan

      - name: Build perf and services tests
        run: cmake --build --preset linux-tsan --parallel --target unit_perf numerical_perf unit_services

      - name: Test
        run: ctest --preset linux-tsan --parallel 4 -R "^(WorkerPool|Runners|Benchmark|BenchmarkReportIO|JobRunner|LogSink)\."
