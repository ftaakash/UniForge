<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>P18 algorithm flow</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="24.00" y="34.00" font-size="18.00" text-anchor="start" fill="#1A1E24" font-weight="600">How each solver works</text>
<text x="24.00" y="56.00" font-size="12.50" text-anchor="start" fill="#59616E">Setup runs once per matrix K; solve runs once per load vector f. Grey notes: the cost that dominates.</text>
<text x="220.00" y="96.00" font-size="15.00" text-anchor="middle" fill="#0072B2" font-weight="600">A  Sparse direct (Cholesky)</text>
<rect x="30.00" y="116.00" width="380.00" height="70.00" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.50" rx="8.00"/>
<text x="44.00" y="142.00" font-size="13.00" text-anchor="start" fill="#1A1E24" font-weight="600">1 Ordering</text>
<text x="44.00" y="162.00" font-size="11.20" text-anchor="start" fill="#59616E">RCM (bandwidth) or nested dissection</text>
<text x="44.00" y="176.56" font-size="11.20" text-anchor="start" fill="#59616E">(separators): P·K·Pᵀ</text>
<line x1="220.00" y1="186.00" x2="220.00" y2="198.20" stroke="#0072B2" stroke-width="1.40"/>
<polygon points="220.00,208.00 215.59,198.20 224.41,198.20" fill="#0072B2" stroke="none" stroke-width="1.2"/>
<rect x="30.00" y="210.00" width="380.00" height="70.00" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.50" rx="8.00"/>
<text x="44.00" y="236.00" font-size="13.00" text-anchor="start" fill="#1A1E24" font-weight="600">2 Symbolic analysis</text>
<text x="44.00" y="256.00" font-size="11.20" text-anchor="start" fill="#59616E">elimination tree, exact column counts</text>
<text x="44.00" y="270.56" font-size="11.20" text-anchor="start" fill="#59616E">→ memory known before allocating</text>
<line x1="220.00" y1="280.00" x2="220.00" y2="292.20" stroke="#0072B2" stroke-width="1.40"/>
<polygon points="220.00,302.00 215.59,292.20 224.41,292.20" fill="#0072B2" stroke="none" stroke-width="1.2"/>
<rect x="30.00" y="304.00" width="380.00" height="70.00" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.50" rx="8.00"/>
<text x="44.00" y="330.00" font-size="13.00" text-anchor="start" fill="#1A1E24" font-weight="600">3 Budget check</text>
<text x="44.00" y="350.00" font-size="11.20" text-anchor="start" fill="#59616E">factor &gt; 8 GB → OverBudget, stop</text>
<line x1="220.00" y1="374.00" x2="220.00" y2="386.20" stroke="#0072B2" stroke-width="1.40"/>
<polygon points="220.00,396.00 215.59,386.20 224.41,386.20" fill="#0072B2" stroke="none" stroke-width="1.2"/>
<rect x="30.00" y="398.00" width="380.00" height="70.00" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.50" rx="8.00"/>
<text x="44.00" y="424.00" font-size="13.00" text-anchor="start" fill="#1A1E24" font-weight="600">4 Numeric factorisation</text>
<text x="44.00" y="444.00" font-size="11.20" text-anchor="start" fill="#59616E">up-looking: row k of L by a sparse</text>
<text x="44.00" y="458.56" font-size="11.20" text-anchor="start" fill="#59616E">triangular solve; cost ∝ Σ count²</text>
<line x1="220.00" y1="468.00" x2="220.00" y2="480.20" stroke="#0072B2" stroke-width="1.40"/>
<polygon points="220.00,490.00 215.59,480.20 224.41,480.20" fill="#0072B2" stroke="none" stroke-width="1.2"/>
<rect x="30.00" y="492.00" width="380.00" height="70.00" fill="#0072B2" stroke="#0072B2" stroke-width="1.50" rx="8.00"/>
<text x="44.00" y="518.00" font-size="13.00" text-anchor="start" fill="#FFFFFF" font-weight="600">5 Two triangular solves</text>
<text x="44.00" y="538.00" font-size="11.20" text-anchor="start" fill="#FFFFFF">L·y = P·f, Lᵀ·z = y; cost ∝ nnz(L),</text>
<text x="44.00" y="552.56" font-size="11.20" text-anchor="start" fill="#FFFFFF">independent of κ(K)</text>
<line x1="220.00" y1="562.00" x2="220.00" y2="574.20" stroke="#0072B2" stroke-width="1.40"/>
<polygon points="220.00,584.00 215.59,574.20 224.41,574.20" fill="#0072B2" stroke="none" stroke-width="1.2"/>
<rect x="30.00" y="586.00" width="380.00" height="70.00" fill="#0072B2" stroke="#0072B2" stroke-width="1.50" rx="8.00"/>
<text x="44.00" y="612.00" font-size="13.00" text-anchor="start" fill="#FFFFFF" font-weight="600">6 Checks</text>
<text x="44.00" y="632.00" font-size="11.20" text-anchor="start" fill="#FFFFFF">pivot ratio and residual: a singular K</text>
<text x="44.00" y="646.56" font-size="11.20" text-anchor="start" fill="#FFFFFF">is a Breakdown, not an answer</text>
<text x="700.00" y="96.00" font-size="15.00" text-anchor="middle" fill="#E69F00" font-weight="600">B  Preconditioned CG (Jacobi, IC(0))</text>
<rect x="510.00" y="116.00" width="380.00" height="70.00" fill="#FFFFFF" stroke="#E69F00" stroke-width="1.50" rx="8.00"/>
<text x="524.00" y="142.00" font-size="13.00" text-anchor="start" fill="#1A1E24" font-weight="600">1 Preconditioner M</text>
<text x="524.00" y="162.00" font-size="11.20" text-anchor="start" fill="#59616E">Jacobi: M = diag(K)</text>
<text x="524.00" y="176.56" font-size="11.20" text-anchor="start" fill="#59616E">IC(0): L̃L̃ᵀ ≈ K on K's own pattern</text>
<line x1="700.00" y1="186.00" x2="700.00" y2="198.20" stroke="#E69F00" stroke-width="1.40"/>
<polygon points="700.00,208.00 695.59,198.20 704.41,198.20" fill="#E69F00" stroke="none" stroke-width="1.2"/>
<rect x="510.00" y="210.00" width="380.00" height="70.00" fill="#FFFFFF" stroke="#E69F00" stroke-width="1.50" rx="8.00"/>
<text x="524.00" y="236.00" font-size="13.00" text-anchor="start" fill="#1A1E24" font-weight="600">2 Shift ladder (IC(0))</text>
<text x="524.00" y="256.00" font-size="11.20" text-anchor="start" fill="#59616E">pivot ≤ 0 → retry with K + α·diag(K),</text>
<text x="524.00" y="270.56" font-size="11.20" text-anchor="start" fill="#59616E">α = 1e-3, 1e-2, …</text>
<line x1="700.00" y1="280.00" x2="700.00" y2="292.20" stroke="#E69F00" stroke-width="1.40"/>
<polygon points="700.00,302.00 695.59,292.20 704.41,292.20" fill="#E69F00" stroke="none" stroke-width="1.2"/>
<rect x="510.00" y="304.00" width="380.00" height="70.00" fill="#E69F00" stroke="#E69F00" stroke-width="1.50" rx="8.00"/>
<text x="524.00" y="330.00" font-size="13.00" text-anchor="start" fill="#FFFFFF" font-weight="600">3 CG iteration</text>
<text x="524.00" y="350.00" font-size="11.20" text-anchor="start" fill="#FFFFFF">q = K·p (SpMV), α = rᵀz / pᵀq,</text>
<text x="524.00" y="364.56" font-size="11.20" text-anchor="start" fill="#FFFFFF">x += αp, r −= αq</text>
<line x1="700.00" y1="374.00" x2="700.00" y2="386.20" stroke="#E69F00" stroke-width="1.40"/>
<polygon points="700.00,396.00 695.59,386.20 704.41,386.20" fill="#E69F00" stroke="none" stroke-width="1.2"/>
<rect x="510.00" y="398.00" width="380.00" height="70.00" fill="#E69F00" stroke="#E69F00" stroke-width="1.50" rx="8.00"/>
<text x="524.00" y="424.00" font-size="13.00" text-anchor="start" fill="#FFFFFF" font-weight="600">4 Precondition</text>
<text x="524.00" y="444.00" font-size="11.20" text-anchor="start" fill="#FFFFFF">z = M⁻¹r (diagonal scale or two</text>
<text x="524.00" y="458.56" font-size="11.20" text-anchor="start" fill="#FFFFFF">triangular solves)</text>
<line x1="700.00" y1="468.00" x2="700.00" y2="480.20" stroke="#E69F00" stroke-width="1.40"/>
<polygon points="700.00,490.00 695.59,480.20 704.41,480.20" fill="#E69F00" stroke="none" stroke-width="1.2"/>
<rect x="510.00" y="492.00" width="380.00" height="70.00" fill="#E69F00" stroke="#E69F00" stroke-width="1.50" rx="8.00"/>
<text x="524.00" y="518.00" font-size="13.00" text-anchor="start" fill="#FFFFFF" font-weight="600">5 Stop test</text>
<text x="524.00" y="538.00" font-size="11.20" text-anchor="start" fill="#FFFFFF">‖r‖/‖f‖ ≤ 1e-10; iterations grow</text>
<text x="524.00" y="552.56" font-size="11.20" text-anchor="start" fill="#FFFFFF">with √κ(M⁻¹K)</text>
<line x1="700.00" y1="562.00" x2="700.00" y2="574.20" stroke="#E69F00" stroke-width="1.40"/>
<polygon points="700.00,584.00 695.59,574.20 704.41,574.20" fill="#E69F00" stroke="none" stroke-width="1.2"/>
<rect x="510.00" y="586.00" width="380.00" height="70.00" fill="#E69F00" stroke="#E69F00" stroke-width="1.50" rx="8.00"/>
<text x="524.00" y="612.00" font-size="13.00" text-anchor="start" fill="#FFFFFF" font-weight="600">6 Lanczos κ estimate</text>
<text x="524.00" y="632.00" font-size="11.20" text-anchor="start" fill="#FFFFFF">from the CG coefficients,</text>
<text x="524.00" y="646.56" font-size="11.20" text-anchor="start" fill="#FFFFFF">at no extra SpMV</text>
<text x="1180.00" y="96.00" font-size="15.00" text-anchor="middle" fill="#009E73" font-weight="600">C  Smoothed-aggregation AMG</text>
<rect x="990.00" y="116.00" width="380.00" height="70.00" fill="#FFFFFF" stroke="#009E73" stroke-width="1.50" rx="8.00"/>
<text x="1004.00" y="142.00" font-size="13.00" text-anchor="start" fill="#1A1E24" font-weight="600">1 Strength of connection</text>
<text x="1004.00" y="162.00" font-size="11.20" text-anchor="start" fill="#59616E">|a_ij| ≥ θ·√(a_ii a_jj), θ halved per level</text>
<line x1="1180.00" y1="186.00" x2="1180.00" y2="198.20" stroke="#009E73" stroke-width="1.40"/>
<polygon points="1180.00,208.00 1175.59,198.20 1184.41,198.20" fill="#009E73" stroke="none" stroke-width="1.2"/>
<rect x="990.00" y="210.00" width="380.00" height="70.00" fill="#FFFFFF" stroke="#009E73" stroke-width="1.50" rx="8.00"/>
<text x="1004.00" y="236.00" font-size="13.00" text-anchor="start" fill="#1A1E24" font-weight="600">2 Aggregation</text>
<text x="1004.00" y="256.00" font-size="11.20" text-anchor="start" fill="#59616E">greedy: roots with free neighbours,</text>
<text x="1004.00" y="270.56" font-size="11.20" text-anchor="start" fill="#59616E">then joins, then leftovers</text>
<line x1="1180.00" y1="280.00" x2="1180.00" y2="292.20" stroke="#009E73" stroke-width="1.40"/>
<polygon points="1180.00,302.00 1175.59,292.20 1184.41,292.20" fill="#009E73" stroke="none" stroke-width="1.2"/>
<rect x="990.00" y="304.00" width="380.00" height="70.00" fill="#FFFFFF" stroke="#009E73" stroke-width="1.50" rx="8.00"/>
<text x="1004.00" y="330.00" font-size="13.00" text-anchor="start" fill="#1A1E24" font-weight="600">3 Prolongator P</text>
<text x="1004.00" y="350.00" font-size="11.20" text-anchor="start" fill="#59616E">piecewise constant, then smoothed:</text>
<text x="1004.00" y="364.56" font-size="11.20" text-anchor="start" fill="#59616E">P = (I − ω D⁻¹A_F) P₀</text>
<line x1="1180.00" y1="374.00" x2="1180.00" y2="386.20" stroke="#009E73" stroke-width="1.40"/>
<polygon points="1180.00,396.00 1175.59,386.20 1184.41,386.20" fill="#009E73" stroke="none" stroke-width="1.2"/>
<rect x="990.00" y="398.00" width="380.00" height="70.00" fill="#FFFFFF" stroke="#009E73" stroke-width="1.50" rx="8.00"/>
<text x="1004.00" y="424.00" font-size="13.00" text-anchor="start" fill="#1A1E24" font-weight="600">4 Galerkin hierarchy</text>
<text x="1004.00" y="444.00" font-size="11.20" text-anchor="start" fill="#59616E">A_c = Pᵀ A P (SpGEMM) down to</text>
<text x="1004.00" y="458.56" font-size="11.20" text-anchor="start" fill="#59616E">≤ 500 rows, then a direct solve</text>
<line x1="1180.00" y1="468.00" x2="1180.00" y2="480.20" stroke="#009E73" stroke-width="1.40"/>
<polygon points="1180.00,490.00 1175.59,480.20 1184.41,480.20" fill="#009E73" stroke="none" stroke-width="1.2"/>
<rect x="990.00" y="492.00" width="380.00" height="70.00" fill="#009E73" stroke="#009E73" stroke-width="1.50" rx="8.00"/>
<text x="1004.00" y="518.00" font-size="13.00" text-anchor="start" fill="#FFFFFF" font-weight="600">5 V-cycle</text>
<text x="1004.00" y="538.00" font-size="11.20" text-anchor="start" fill="#FFFFFF">symmetric Gauss–Seidel, restrict,</text>
<text x="1004.00" y="552.56" font-size="11.20" text-anchor="start" fill="#FFFFFF">coarse correction, prolong, smooth</text>
<line x1="1180.00" y1="562.00" x2="1180.00" y2="574.20" stroke="#009E73" stroke-width="1.40"/>
<polygon points="1180.00,584.00 1175.59,574.20 1184.41,574.20" fill="#009E73" stroke="none" stroke-width="1.2"/>
<rect x="990.00" y="586.00" width="380.00" height="70.00" fill="#009E73" stroke="#009E73" stroke-width="1.50" rx="8.00"/>
<text x="1004.00" y="612.00" font-size="13.00" text-anchor="start" fill="#FFFFFF" font-weight="600">6 Stand-alone or in CG</text>
<text x="1004.00" y="632.00" font-size="11.20" text-anchor="start" fill="#FFFFFF">AMG: repeat V-cycles</text>
<text x="1004.00" y="646.56" font-size="11.20" text-anchor="start" fill="#FFFFFF">AMG-PCG: one V-cycle as M⁻¹ in CG</text>
</svg>
