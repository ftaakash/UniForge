<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>P8 sparsity patterns</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="24.00" y="34.00" font-size="18.00" text-anchor="start" fill="#1A1E24" font-weight="600">Sparsity of K and of the Cholesky factor L under three orderings (HS-7, s = 2 mm)</text>
<text x="24.00" y="56.00" font-size="12.50" text-anchor="start" fill="#59616E">Density rasters: darker = more entries per block. Fill-in is the area L covers beyond K.</text>
<image x="24.00" y="100.00" width="300.00" height="300.00" href="P8_spy-1.png"/>
<rect x="24.00" y="100.00" width="300.00" height="300.00" fill="none" stroke="#59616E" stroke-width="0.80"/>
<text x="174.00" y="425.00" font-size="12.50" text-anchor="middle" fill="#1A1E24">K (grid order): nnz = 288544</text>
<image x="370.00" y="100.00" width="300.00" height="300.00" href="P8_spy-2.png"/>
<rect x="370.00" y="100.00" width="300.00" height="300.00" fill="none" stroke="#59616E" stroke-width="0.80"/>
<text x="520.00" y="425.00" font-size="12.50" text-anchor="middle" fill="#1A1E24">L, natural: nnz = 8.23e+06</text>
<image x="710.00" y="100.00" width="300.00" height="300.00" href="P8_spy-3.png"/>
<rect x="710.00" y="100.00" width="300.00" height="300.00" fill="none" stroke="#59616E" stroke-width="0.80"/>
<text x="860.00" y="425.00" font-size="12.50" text-anchor="middle" fill="#1A1E24">L, RCM: nnz = 2.4e+06</text>
<image x="1050.00" y="100.00" width="300.00" height="300.00" href="P8_spy-4.png"/>
<rect x="1050.00" y="100.00" width="300.00" height="300.00" fill="none" stroke="#59616E" stroke-width="0.80"/>
<text x="1200.00" y="425.00" font-size="12.50" text-anchor="middle" fill="#1A1E24">L, nested dissection: nnz = 2.27e+06</text>
<text x="24.00" y="455.00" font-size="11.50" text-anchor="start" fill="#59616E">n = 13200 DOF. L is stored as its lower triangle; nnz includes the diagonal.</text>
</svg>
