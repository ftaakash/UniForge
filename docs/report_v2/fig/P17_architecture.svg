<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>P17 architecture</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="24.00" y="34.00" font-size="18.00" text-anchor="start" fill="#1A1E24" font-weight="600">Software architecture of the V2 solver study</text>
<text x="24.00" y="56.00" font-size="12.50" text-anchor="start" fill="#59616E">C++17 core with no third-party code; arrows point from a module to what it uses. The solvers never see the mesh (lint-checked).</text>
<rect x="500.00" y="80.00" width="400.00" height="110.00" fill="#FFFFFF" stroke="#1A1E24" stroke-width="1.60" rx="8.00"/>
<rect x="500.00" y="80.00" width="400.00" height="30.00" fill="#1A1E24" stroke="none" stroke-width="0.00" rx="8.00"/>
<rect x="500.00" y="100.00" width="400.00" height="10.00" fill="#1A1E24" stroke="none" stroke-width="1.00"/>
<text x="512.00" y="101.00" font-size="13.50" text-anchor="start" fill="#FFFFFF" font-weight="600">uniforge_cli study</text>
<text x="512.00" y="130.00" font-size="11.50" text-anchor="start" fill="#1A1E24">plan · run · batch · collect · figures</text>
<text x="512.00" y="146.10" font-size="11.50" text-anchor="start" fill="#1A1E24">one process per run, Job Object memory cap,</text>
<text x="512.00" y="162.20" font-size="11.50" text-anchor="start" fill="#1A1E24">P-core pinning, resume</text>
<rect x="500.00" y="240.00" width="400.00" height="120.00" fill="#FFFFFF" stroke="#59616E" stroke-width="1.60" rx="8.00"/>
<rect x="500.00" y="240.00" width="400.00" height="30.00" fill="#59616E" stroke="none" stroke-width="0.00" rx="8.00"/>
<rect x="500.00" y="260.00" width="400.00" height="10.00" fill="#59616E" stroke="none" stroke-width="1.00"/>
<text x="512.00" y="261.00" font-size="13.50" text-anchor="start" fill="#FFFFFF" font-weight="600">study</text>
<text x="512.00" y="290.00" font-size="11.50" text-anchor="start" fill="#1A1E24">RunSpec (E0–E8), Runner (one run: mesh,</text>
<text x="512.00" y="306.10" font-size="11.50" text-anchor="start" fill="#1A1E24">assemble, setup, timed solves, audit),</text>
<text x="512.00" y="322.20" font-size="11.50" text-anchor="start" fill="#1A1E24">Collect (CSV), Figures (P1–P22)</text>
<rect x="60.00" y="420.00" width="380.00" height="150.00" fill="#FFFFFF" stroke="#CC79A7" stroke-width="1.60" rx="8.00"/>
<rect x="60.00" y="420.00" width="380.00" height="30.00" fill="#CC79A7" stroke="none" stroke-width="0.00" rx="8.00"/>
<rect x="60.00" y="440.00" width="380.00" height="10.00" fill="#CC79A7" stroke="none" stroke-width="1.00"/>
<text x="72.00" y="441.00" font-size="13.50" text-anchor="start" fill="#FFFFFF" font-weight="600">fem3d</text>
<text x="72.00" y="470.00" font-size="11.50" text-anchor="start" fill="#1A1E24">Design (boxes, materials, BCs)</text>
<text x="72.00" y="486.10" font-size="11.50" text-anchor="start" fill="#1A1E24">HexMesh (graded tensor grid)</text>
<text x="72.00" y="502.20" font-size="11.50" text-anchor="start" fill="#1A1E24">Element (Q1 hex), Assembly → CSR</text>
<text x="72.00" y="518.30" font-size="11.50" text-anchor="start" fill="#1A1E24">Post (energy audit, sampling)</text>
<rect x="510.00" y="420.00" width="380.00" height="150.00" fill="#FFFFFF" stroke="#009E73" stroke-width="1.60" rx="8.00"/>
<rect x="510.00" y="420.00" width="380.00" height="30.00" fill="#009E73" stroke="none" stroke-width="0.00" rx="8.00"/>
<rect x="510.00" y="440.00" width="380.00" height="10.00" fill="#009E73" stroke="none" stroke-width="1.00"/>
<text x="522.00" y="441.00" font-size="13.50" text-anchor="start" fill="#FFFFFF" font-weight="600">solvers</text>
<text x="522.00" y="470.00" font-size="11.50" text-anchor="start" fill="#1A1E24">direct/ Ordering (RCM, ND), Cholesky</text>
<text x="522.00" y="486.10" font-size="11.50" text-anchor="start" fill="#1A1E24">krylov/ PCG, Jacobi, IC(0), Lanczos κ</text>
<text x="522.00" y="502.20" font-size="11.50" text-anchor="start" fill="#1A1E24">amg/ strength, aggregates, P, V-cycle</text>
<text x="522.00" y="518.30" font-size="11.50" text-anchor="start" fill="#1A1E24">one interface: setup() + solve()</text>
<rect x="960.00" y="420.00" width="380.00" height="150.00" fill="#FFFFFF" stroke="#E69F00" stroke-width="1.60" rx="8.00"/>
<rect x="960.00" y="420.00" width="380.00" height="30.00" fill="#E69F00" stroke="none" stroke-width="0.00" rx="8.00"/>
<rect x="960.00" y="440.00" width="380.00" height="10.00" fill="#E69F00" stroke="none" stroke-width="1.00"/>
<text x="972.00" y="441.00" font-size="13.50" text-anchor="start" fill="#FFFFFF" font-weight="600">viz</text>
<text x="972.00" y="470.00" font-size="11.50" text-anchor="start" fill="#1A1E24">Raster3D (z-buffer), Spy, Colormap,</text>
<text x="972.00" y="486.10" font-size="11.50" text-anchor="start" fill="#1A1E24">PngWriter (deflate), SvgCanvas</text>
<text x="972.00" y="502.20" font-size="11.50" text-anchor="start" fill="#1A1E24">plain arrays in, no mesh types</text>
<rect x="510.00" y="610.00" width="380.00" height="90.00" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.60" rx="8.00"/>
<rect x="510.00" y="610.00" width="380.00" height="30.00" fill="#0072B2" stroke="none" stroke-width="0.00" rx="8.00"/>
<rect x="510.00" y="630.00" width="380.00" height="10.00" fill="#0072B2" stroke="none" stroke-width="1.00"/>
<text x="522.00" y="631.00" font-size="13.50" text-anchor="start" fill="#FFFFFF" font-weight="600">sparse</text>
<text x="522.00" y="660.00" font-size="11.50" text-anchor="start" fill="#1A1E24">CsrMatrix, KernelPool (fixed chunks:</text>
<text x="522.00" y="676.10" font-size="11.50" text-anchor="start" fill="#1A1E24">same bits for any thread count), SpMV, SpGEMM</text>
<rect x="960.00" y="610.00" width="380.00" height="90.00" fill="#FFFFFF" stroke="#7A828E" stroke-width="1.60" rx="8.00"/>
<rect x="960.00" y="610.00" width="380.00" height="30.00" fill="#7A828E" stroke="none" stroke-width="0.00" rx="8.00"/>
<rect x="960.00" y="630.00" width="380.00" height="10.00" fill="#7A828E" stroke="none" stroke-width="1.00"/>
<text x="972.00" y="631.00" font-size="13.50" text-anchor="start" fill="#FFFFFF" font-weight="600">common (v1)</text>
<text x="972.00" y="660.00" font-size="11.50" text-anchor="start" fill="#1A1E24">Result/Error, AtomicFile, CsvWriter,</text>
<text x="972.00" y="676.10" font-size="11.50" text-anchor="start" fill="#1A1E24">MetaJson, SvgPlot</text>
